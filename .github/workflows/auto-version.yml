# Prepare release changes only after CI succeeds on protected main. Normal
# changes produce a pull request; a successfully tested release commit produces
# the corresponding annotated tag.
name: Auto Version Bump

on:
  workflow_run:
    workflows:
      - CI Pipeline
    branches:
      - main
    types:
      - completed

concurrency:
  group: auto-version-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Prepare Release PR or Tag
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested main commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify main still matches the tested commit
        id: state
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          CURRENT_SHA="$(git rev-parse HEAD)"
          if [[ "$CURRENT_SHA" != "$TESTED_SHA" ]]; then
            echo "A newer main commit exists; its CI run will handle versioning."
            echo "current=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current=true" >> "$GITHUB_OUTPUT"
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq VERSION; then
            echo "release_commit=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.state.outputs.current == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create annotated release tag
        if: |
          steps.state.outputs.current == 'true' &&
          steps.state.outputs.release_commit == 'true'
        run: |
          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION_VALUE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid VERSION value: $VERSION_VALUE" >&2
            exit 1
          fi
          if ! grep -Fq "## [$VERSION_VALUE]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for $VERSION_VALUE" >&2
            exit 1
          fi

          TAG="v$VERSION_VALUE"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; nothing to do."
            exit 0
          fi

          git config user.email "citadel-autoversion@nested-ai.net"
          git config user.name "Citadel AutoVersion"
          git tag -a "$TAG" -m "Release $TAG" "${{ github.event.workflow_run.head_sha }}"
          git push origin "$TAG"

      - name: Prepare version files
        id: prepare
        if: |
          steps.state.outputs.current == 'true' &&
          steps.state.outputs.release_commit == 'false'
        run: |
          python scripts/bump_version.py
          if git diff --quiet -- VERSION CHANGELOG.md docker-compose.staging.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          VERSION_VALUE="$(tr -d '[:space:]' < VERSION)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION_VALUE" >> "$GITHUB_OUTPUT"

      - name: Commit and push release branch
        if: steps.prepare.outputs.changed == 'true'
        env:
          VERSION_VALUE: ${{ steps.prepare.outputs.version }}
        run: |
          BRANCH="automation/version-bump"
          git config user.email "citadel-autoversion@nested-ai.net"
          git config user.name "Citadel AutoVersion"
          git checkout -B "$BRANCH"
          git add VERSION CHANGELOG.md docker-compose.staging.yml
          git commit -m "chore(release): bump version to $VERSION_VALUE"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH"

      - name: Open or refresh release pull request
        if: steps.prepare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_VALUE: ${{ steps.prepare.outputs.version }}
        run: |
          BRANCH="automation/version-bump"
          TITLE="chore(release): bump version to $VERSION_VALUE"
          BODY="Automated release preparation after CI passed on main.

          - Updates VERSION, CHANGELOG.md, and docker-compose.staging.yml
          - Requires the normal protected-branch review and CI gates
          - Creates tag v$VERSION_VALUE only after this PR is merged and CI passes"

          PR_NUMBER="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$PR_NUMBER" ]]; then
            gh pr edit "$PR_NUMBER" --title "$TITLE" --body "$BODY"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
          fi

      - name: Write summary
        if: always()
        env:
          VERSION_VALUE: ${{ steps.prepare.outputs.version }}
        run: |
          if [[ "${{ steps.state.outputs.current }}" != "true" ]]; then
            echo "A newer main commit superseded this run." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.state.outputs.release_commit }}" == "true" ]]; then
            echo "Release tag validation completed." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.prepare.outputs.changed }}" == "true" ]]; then
            echo "Prepared release PR for v$VERSION_VALUE." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No version-bumping commits were found." >> "$GITHUB_STEP_SUMMARY"
          fi
