name: CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NATS_ENABLED: "false"
  OTEL_ENABLED: "false"
  OTEL_SDK_DISABLED: "true"

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install quality tools
        run: python -m pip install black==24.1.1 flake8==7.0.0

      - name: Check formatting
        run: black --check --line-length 100 backend tests scripts

      - name: Run Flake8
        run: |
          flake8 backend tests scripts \
            --max-line-length=100 \
            --extend-ignore=E203,W503 \
            --count \
            --statistics

      - name: Compile Python sources
        run: python -m compileall -q backend tests scripts

  test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs:
      - quality
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest-json-report
          python -m pip check

      - name: Run complete test suite
        run: |
          pytest -q \
            --cov-report=xml \
            --json-report \
            --json-report-file=test-results.json

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@v7.0.0
        with:
          files: coverage.xml
          flags: full-suite
          name: omnipath-coverage
          fail_ci_if_error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results
          path: test-results.json
          if-no-files-found: warn
          retention-days: 30

  security:
    name: Static Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: python -m pip install bandit==1.9.4

      - name: Scan backend
        run: |
          bandit -r backend \
            --severity-level medium \
            --confidence-level medium \
            --format txt

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test
      - security
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: omnipath:${{ github.sha }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: omnipath:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
